services:


  blog:
    image: ${BLOG_IMAGE:-ghcr.io/jung-geun/tablog:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_UTTERANCES_REPO: ${NEXT_PUBLIC_UTTERANCES_REPO:-}
        NEXT_PUBLIC_NOTION_COMMENTS_ENABLE: ${NEXT_PUBLIC_NOTION_COMMENTS_ENABLE:-false}
        NEXT_PUBLIC_GOOGLE_ADSENSE_DISABLE: ${NEXT_PUBLIC_GOOGLE_ADSENSE_DISABLE:-false}
        NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT: ${NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_GOOGLE_ADSENSE_MODE: ${NEXT_PUBLIC_GOOGLE_ADSENSE_MODE:-auto}
        NEXT_PUBLIC_GOOGLE_ADSENSE_AUTO_ADS_IN_PAGE_DISABLED_CONFIRMED: ${NEXT_PUBLIC_GOOGLE_ADSENSE_AUTO_ADS_IN_PAGE_DISABLED_CONFIRMED:-false}
        NEXT_PUBLIC_GOOGLE_ADSENSE_ARTICLE_SLOT: ${NEXT_PUBLIC_GOOGLE_ADSENSE_ARTICLE_SLOT:-}
        NEXT_PUBLIC_GOOGLE_ADSENSE_POST_BOTTOM_SLOT: ${NEXT_PUBLIC_GOOGLE_ADSENSE_POST_BOTTOM_SLOT:-}
        NEXT_PUBLIC_GOOGLE_ADSENSE_AUTO_ADS_DISABLED_CONFIRMED: ${NEXT_PUBLIC_GOOGLE_ADSENSE_AUTO_ADS_DISABLED_CONFIRMED:-false}
        REVALIDATE_HOURS: ${REVALIDATE_HOURS:-${NEXT_PUBLIC_REVALIDATE_HOURS:-6}}
    container_name: blog
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NOTION_TOKEN: ${NOTION_TOKEN:?required}
      NOTION_DATASOURCE_ID: ${NOTION_DATASOURCE_ID:?required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?required}
      CONTENT_RECONCILE_INTERVAL_MINUTES: ${CONTENT_RECONCILE_INTERVAL_MINUTES:-10080}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:-}
      REDIS_URL: redis://redis:6379
      CONTENT_REDIS_URL: redis://content-redis:6379
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SERVICE_URL: http://embedding:8000
    depends_on:
      redis:
        condition: service_healthy
      content-redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - logs-data:/app/logs
      - image-cache:/app/.image-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Durable content authority. AOF is enabled from its first boot; enabling AOF
  # on the existing cache Redis by restart would discard its RDB dataset.
  content-redis:
    image: redis:7.4-alpine
    container_name: blog-content-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - content-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: blog-qdrant
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Private CPU-only text embeddings. The public model needs no API key.
  embedding:
    image: ${EMBEDDING_IMAGE:-ghcr.io/jung-geun/tablog-embedding:latest}
    build:
      context: ./services/embedding
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
      - embedding-model-cache:/models
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    # No host port: only blog and other containers on the Compose network can connect.
    # Readiness follows the initial Hub download AND actual CPU inference warmup.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30m

volumes:
  logs-data:
  image-cache:
  redis-data:
  content-redis-data:
  qdrant-storage:
  embedding-model-cache:

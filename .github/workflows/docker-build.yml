name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image-tag:
        description: Published image tag to pull, verify, and export as a transfer artifact
        required: true
        default: latest
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - suffix: ""
            context: .
          - suffix: "-embedding"
            context: ./services/embedding
    env:
      IMAGE_NAME: ${{ github.repository }}${{ matrix.suffix }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
            echo "value=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Keep runner temp alive during build
        run: |
          (while true; do
            find "$RUNNER_TEMP" -maxdepth 4 -exec touch {} + 2>/dev/null || true
            sleep 15
          done) &
          echo "KEEPALIVE_PID=$!" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_UTTERANCES_REPO=${{ vars.NEXT_PUBLIC_UTTERANCES_REPO }}
            NEXT_PUBLIC_NOTION_COMMENTS_ENABLE=${{ vars.NEXT_PUBLIC_NOTION_COMMENTS_ENABLE }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_DISABLE=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_DISABLE }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_MODE=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_MODE }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_AUTO_ADS_IN_PAGE_DISABLED_CONFIRMED=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_AUTO_ADS_IN_PAGE_DISABLED_CONFIRMED || 'false' }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_ARTICLE_SLOT=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_ARTICLE_SLOT }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_POST_BOTTOM_SLOT=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_POST_BOTTOM_SLOT }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_AUTO_ADS_DISABLED_CONFIRMED=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_AUTO_ADS_DISABLED_CONFIRMED }}
            REVALIDATE_HOURS=${{ vars.REVALIDATE_HOURS }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64

      - name: Stop temp keepalive
        if: always()
        run: kill "$KEEPALIVE_PID" 2>/dev/null || true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      - name: Output image tags
        run: echo "Pushed tags ${{ steps.tags.outputs.value }}"

  stage-for-deployment:
    # ARC runners are ephemeral pods with their own DinD sidecar: a pull alone
    # would vanish with the pod. Export verified images as an artifact the
    # operator loads onto the production daemon (which holds no GHCR credentials).
    if: github.event_name == 'workflow_dispatch'
    runs-on: monolog-arc
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull and verify published images
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          for SUFFIX in '' '-embedding'; do
            IMAGE="${REGISTRY}/${IMAGE_NAME}${SUFFIX}"
            docker pull "${IMAGE}:${IMAGE_TAG}"
            docker image inspect "${IMAGE}:${IMAGE_TAG}" --format '{{.Id}} {{.Os}}/{{.Architecture}} {{index .Config.Labels "org.opencontainers.image.revision"}}'
            docker image inspect "${IMAGE}:${IMAGE_TAG}" --format '{{json .RepoDigests}}'
          done

      - name: Export images for transfer
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          mkdir -p /tmp/stage
          for SUFFIX in '' '-embedding'; do
            IMAGE="${REGISTRY}/${IMAGE_NAME}${SUFFIX}"
            NAME="$(echo "${IMAGE_NAME}${SUFFIX}" | tr '/' '-')"
            docker save "${IMAGE}:${IMAGE_TAG}" | gzip > "/tmp/stage/${NAME}-${IMAGE_TAG}.tar.gz"
          done
          (cd /tmp/stage && sha256sum ./*.tar.gz | tee SHA256SUMS)

      - name: Upload staged images
        uses: actions/upload-artifact@v7
        with:
          name: tablog-images-${{ inputs.image-tag }}
          path: /tmp/stage/
          retention-days: 7
